# PRODUCTION (Railway). Loaded when SPRING_PROFILES_ACTIVE=prod.
# This file IS in git, so it must never contain a secret: every secret comes from an environment variable.

# Railway's proxy adds X-Forwarded-For / X-Forwarded-Proto: trust them to get the real client IP and https.
server.forward-headers-strategy=framework

# Connection pool sized for a small instance (Railway's MySQL handles plenty more).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
