spring.application.name=Vornx

# Which extra settings file to load: "local" on your PC (application-local.properties, NOT in git),
# "prod" on Railway (SPRING_PROFILES_ACTIVE=prod -> application-prod.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------- Database ----------
# Local: XAMPP MariaDB. Railway: MySQL 8 (DB_URL is set there).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/vornx_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# "validate" = Hibernate never changes tables; it only checks entities match them.
# Tables are created by Flyway migrations instead (safe + versioned).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Server ----------
# Railway tells the app which port to use through the PORT variable.
server.port=${PORT:8080}
server.error.include-stacktrace=never
# On a redeploy, finish the requests in progress before stopping.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
# "never": the public only sees {"status":"UP"}, not database details. (Local profile shows everything.)
management.endpoint.health.show-details=never
# A mail-server outage must NOT mark the API as down (Railway would then stop the deploy):
# emails wait in the outbox and are retried, so the app is still healthy.
management.health.mail.enabled=false

# ---------- Security / JWT ----------
# The secret is set in application-local.properties (or the JWT_SECRET env variable on a server)
vornx.jwt.secret=${JWT_SECRET:}
vornx.jwt.issuer=vornx
# Access tokens are short (they cannot be cancelled). Refresh tokens keep the user logged in.
vornx.jwt.expiration=15m
vornx.jwt.refresh-expiration=30d

# ---------- First admin (only used when admin_users is empty) ----------
vornx.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:VORNX Admin}
vornx.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
vornx.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------- Wallet ----------
# Fake top-up (no real payment). NEVER true in production.
vornx.wallet.simulated-top-up-enabled=false

# Card payments (wallet top-up) through Moyasar. Empty key = card top-up unavailable.
# Test keys start with sk_test_ (no real money), live keys with sk_live_. Never commit a key.
vornx.payments.moyasar.secret-key=${MOYASAR_SECRET_KEY:}
# Moyasar POSTs paid invoices here. Must be the API's public https URL, e.g.
# https://vornx.up.railway.app/api/public/payments/moyasar/callback (empty = rely on return page + job)
vornx.payments.moyasar.callback-url=${MOYASAR_CALLBACK_URL:}

# ---------- API docs (Swagger) ----------
# OFF by default: on a public server the full API map helps attackers. Turned on in application-local.properties.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ---------- CORS ----------
# Which websites (origins) may call this API from a browser. Comma-separated, e.g.
#   CORS_ALLOWED_ORIGINS=https://vornx.sa,https://partner.vornx.sa,https://admin.vornx.sa
# Empty = no browser site is allowed (mobile apps and servers are not affected by CORS).
vornx.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------- Email ----------
# mode:
#   "brevo"   = Brevo HTTPS API (production on Railway: works on every plan)
#   "smtp"    = any SMTP server (needs outbound SMTP, e.g. Railway Pro)
#   "preview" = save each email as an .html file + log it (development)
vornx.mail.mode=${MAIL_MODE:smtp}
vornx.mail.brevo.api-key=${BREVO_API_KEY:}
vornx.mail.from=${MAIL_FROM:VORNX <no-reply@vornx.sa>}
vornx.mail.preview-dir=mail-preview
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# Links inside emails point to the frontends
vornx.frontend.admin-url=${ADMIN_URL:https://admin.vornx.sa}
vornx.frontend.partner-url=${PARTNER_URL:https://partner.vornx.sa}
vornx.frontend.customer-url=${CUSTOMER_URL:https://my.vornx.sa}

# Two-step customer login: after the right password, a 6-digit code is sent.
#   "email" = by email (default)   "off" = password only (e.g. while testing)
# SMS (Firebase phone auth) is planned as another option.
vornx.auth.customer-login-code=${CUSTOMER_LOGIN_CODE:email}

# DEV ONLY: also return one-time tokens (invites) in API responses, to test without an inbox. NEVER true in production.
vornx.dev.expose-tokens=false

# Thymeleaf is only used for emails here (no server-rendered web pages)
spring.thymeleaf.check-template-location=false
